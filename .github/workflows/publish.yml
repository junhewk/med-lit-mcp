name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Run tests
        run: uv run pytest
      - name: Run the install script from this checkout
        if: runner.os != 'Windows'
        env:
          MED_LIT_CONFIG_DIR: ${{ runner.temp }}/med-lit-config
          MED_LIT_STATE_DIR: ${{ runner.temp }}/med-lit-state
        run: scripts/install.sh --dev "$GITHUB_WORKSPACE" --email ci@example.org --yes --no-register
      - name: Run the install script from this checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MED_LIT_CONFIG_DIR: ${{ runner.temp }}\med-lit-config
          MED_LIT_STATE_DIR: ${{ runner.temp }}\med-lit-state
        run: ./scripts/install-windows.ps1 -Dev "$env:GITHUB_WORKSPACE" -Email ci@example.org -Yes -NoRegister
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(uv version --short)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
      - name: Build
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  claude-extension:
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build the Claude Desktop extension
        run: uv run python scripts/build_mcpb.py dist-extension
      - name: Attach the Claude Desktop extension to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist-extension/*.mcpb --clobber
